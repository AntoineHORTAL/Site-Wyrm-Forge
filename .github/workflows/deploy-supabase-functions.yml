# Déploie automatiquement toutes les Edge Functions Supabase à chaque push sur main
# qui modifie un fichier dans supabase/functions/
#
# Pré-requis dans les secrets GitHub du repo :
#   - SUPABASE_ACCESS_TOKEN : Personal access token Supabase
#       (générer ici : https://supabase.com/dashboard/account/tokens)
#   - SUPABASE_PROJECT_ID   : ref du projet (cuscgmgqakxnfwnsrhhv)
#
# Déclenchable aussi manuellement via Actions → 'Run workflow'.
#
# ⚠️ Sur pull_request, SEUL le contrôle de syntaxe tourne — jamais le déploiement :
# la prod ne doit pas recevoir le code d'une PR non fusionnée. D'où le garde
# `if: github.event_name != 'pull_request'` sur les deux derniers steps.

name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deno n'est pas préinstallé sur ubuntu-latest, et supabase/setup-cli ne le
      # fournit pas : sans ce step, le contrôle ci-dessous échouerait en
      # « deno: command not found ».
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Filet de syntaxe. Une seule règle triviale est activée : on obtient un
      # contrôle de PARSING pur, sans rien imposer de stylistique. Un fichier qui
      # ne parse pas fait échouer le step (code 1).
      #
      # Pourquoi pas les variantes évidentes : `deno check` échoue sur des erreurs
      # de TYPE préexistantes (riot-matches, riot-match-detail) qui, elles, ne
      # bloquent pas le bundling `--use-api` ; `deno lint` par défaut échoue sur
      # une trentaine de points de style. Ni l'un ni l'autre ne serait vert
      # aujourd'hui, donc ni l'un ni l'autre ne serait un garde crédible.
      #
      # Ce que ça rattrape : db5b11b avait inséré un `import` AU MILIEU d'un bloc
      # import multi-lignes de postgame-analyze. Deno refusait de parser le
      # fichier, la boucle ci-dessous (sous `bash -e`) mourait à la 5e fonction,
      # et les 12 suivantes — dont subscription-emails — n'étaient jamais
      # déployées. Invisible six jours, du 06/09 au 12/09.
      - name: Vérifier que les Edge Functions parsent
        run: deno lint --rules-tags= --rules-include=no-debugger supabase/functions/

      - name: Setup Supabase CLI
        if: github.event_name != 'pull_request'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID:   ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # Liste toutes les fonctions présentes dans supabase/functions (hors _shared)
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            if [ "$name" = "_shared" ]; then continue; fi
            echo "📦 Deploying $name…"
            supabase functions deploy "$name" \
              --project-ref "$SUPABASE_PROJECT_ID" \
              --use-api
          done
          echo "✅ Toutes les fonctions ont été déployées."
