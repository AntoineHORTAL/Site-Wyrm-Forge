# Configuration locale Supabase. Référence : https://supabase.com/docs/guides/cli/config
# Le project_id correspond au project ref de https://cuscgmgqakxnfwnsrhhv.supabase.co
project_id = "cuscgmgqakxnfwnsrhhv"

[functions.riot-rotation]
# Pas d'auth — donnée publique (rotation des champions).
verify_jwt = false

# Les 3 fonctions Riot ci-dessous sont accessibles avec la clé anon (publique),
# sans JWT user. Raison : l'app desktop doit fonctionner pour tout le monde sans
# compte Wyrm Forge (comportement historique). La clé Riot reste protégée côté
# serveur. Rate limiting à ajouter plus tard si abus.
[functions.riot-matches]
verify_jwt = false

[functions.riot-match-detail]
verify_jwt = false

[functions.riot-rank]
verify_jwt = false

# detail-quota (F3 Lot 2) — quota anonyme de consultation du détail d'un match.
# Public (clé anon suffit) : peek/commit clés sur l'IP visiteur, aucune donnée Riot.
[functions.detail-quota]
verify_jwt = false

# Patch notes publiques — pas d'auth requise, données filtrées sur status='published'
[functions.patch-notes]
verify_jwt = false

# riot-live-game : composition de la partie en cours (spectator-v5) — publique,
# gardée en amont par le feature flag live_game_enabled (app_settings).
[functions.riot-live-game]
verify_jwt = false

# Génération des patch notes via Anthropic — réservée aux admins ou au cron interne
[functions.patch-notes-generator]
verify_jwt = true

# Module Tournois
# tournament-register : inscription publique (JWT optionnel — lié si présent)
[functions.tournament-register]
verify_jwt = false

# tournament-admin : actions orga — JWT vérifié DANS LE CODE (getUser → 401),
# pas par la plateforme (convention projet : verify_jwt=false + check applicatif)
[functions.tournament-admin]
verify_jwt = false

# prac-track : tracking de matchs (module prac) — JWT + is_prac_admin vérifiés DANS
# LE CODE (même convention que tournament-admin). Actions : list / resolve / commit.
[functions.prac-track]
verify_jwt = false

# prac-notify : notification de demande de suivi (module prac) — appelée par un
# Database Webhook Supabase (pg_net), pas par un navigateur. Pas de JWT user :
# la barrière est le header X-Internal-Token = PRAC_WEBHOOK_SECRET, vérifié EN CODE.
[functions.prac-notify]
verify_jwt = false

# ── Fonctions nécessitant un user connecté ───────────────────────────────────
# verify_jwt = true déclaré EXPLICITEMENT (était le défaut implicite). La clé anon
# reste un JWT valide accepté par la plateforme ; la vérification du VRAI user est
# faite dans le code via getUser() → 401. Les checks pré-auth (feature flag, rate
# limit) s'exécutent donc toujours pour les requêtes porteuses de la clé anon.
[functions.shop-purchase]
verify_jwt = true

[functions.quest-claim]
verify_jwt = true

[functions.quest-status]
verify_jwt = true

[functions.matchup-analyze]
verify_jwt = true

[functions.riot-link-init]
verify_jwt = true

[functions.riot-link-verify]
verify_jwt = true
