<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Base élargie -->
  <rect x="6" y="27" width="20" height="3" rx="0.5" fill="#5a4218"/>
  <rect x="7" y="26" width="18" height="2" fill="#7a5a1f"/>

  <!-- Corps principal de la tour -->
  <rect x="9" y="14" width="14" height="13" fill="#a17a26"/>

  <!-- Bandes décoratives sur le corps -->
  <rect x="9" y="17" width="14" height="1" fill="#5a4218"/>
  <rect x="9" y="22" width="14" height="1" fill="#5a4218"/>

  <!-- Plateforme entre corps et créneaux -->
  <rect x="8" y="13" width="16" height="1.5" fill="#7a5a1f"/>

  <!-- Créneaux (battlements) -->
  <rect x="8"  y="9.5" width="2.5" height="3.5" fill="#a17a26"/>
  <rect x="12" y="9.5" width="2.5" height="3.5" fill="#a17a26"/>
  <rect x="16" y="9.5" width="2.5" height="3.5" fill="#a17a26"/>
  <rect x="20" y="9.5" width="2.5" height="3.5" fill="#a17a26"/>
  <rect x="8"  y="12.5" width="14.5" height="1" fill="#7a5a1f"/>

  <!-- Toit pointu -->
  <path d="M7 9.5 L16 2 L25 9.5 Z" fill="#c79a3c"/>
  <path d="M9 9.5 L16 4 L23 9.5 Z" fill="#a17a26"/>

  <!-- Petit drapeau / pointe au sommet -->
  <line x1="16" y1="2" x2="16" y2="0" stroke="#c79a3c" stroke-width="0.6"/>

  <!-- Œil canon central (lueur) -->
  <ellipse cx="16" cy="20" rx="2.5" ry="1.5" fill="#FFD56B"/>
  <ellipse cx="16" cy="20" rx="1.2" ry="0.8" fill="#FFF4C9"/>
</svg>
